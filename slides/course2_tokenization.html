<h1 id="course-2-tokenization"><strong>Course 2: Tokenization</strong></h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="2" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="what-is-tokenization">What is tokenization?</h3>
<p>Turning text...</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">I love playing soccer!
</code></pre>
<p>...into <em>tokens</em></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">[&#x27;I&#x27;, &#x27;love&#x27;, &#x27;play&#x27;, &#x27;ing&#x27;, &#x27;soccer&#x27;, &#x27;!&#x27;]
</code></pre>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-class="lead" data-theme="gaia" lang="POSIX" class="lead" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--class:lead;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="historical-notions">Historical Notions</h1>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="tokenization-origins"><em>Tokenization Origins</em></h3>
<p>The word token comes from linguistics</p>
<blockquote>
<p><em>non-empty contiguous sequence of graphemes or phonemes in a document</em></p>
</blockquote>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0.124ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="0.968ex" role="img" focusable="false" viewBox="0 -483 778 428"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2248" d="M55 319Q55 360 72 393T114 444T163 472T205 482Q207 482 213 482T223 483Q262 483 296 468T393 413L443 381Q502 346 553 346Q609 346 649 375T694 454Q694 465 698 474T708 483Q722 483 722 452Q722 386 675 338T555 289Q514 289 468 310T388 357T308 404T224 426Q164 426 125 393T83 318Q81 289 69 289Q55 289 55 319ZM55 85Q55 126 72 159T114 210T163 238T205 248Q207 248 213 248T223 249Q262 249 296 234T393 179L443 147Q502 112 553 112Q609 112 649 141T694 220Q694 249 708 249T722 217Q722 153 675 104T555 55Q514 55 468 76T388 123T308 170T224 192Q164 192 125 159T83 84Q80 55 69 55Q55 55 55 85Z"></path></g></g></g></svg></mjx-container></p>
<p>Split text on blanks</p>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="5" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="tokenization-origins-1"><em>Tokenization Origins</em></h3>
<br />
<br />
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">old<span class="hljs-emphasis">_tokenize(&quot;I love playing soccer!&quot;) = [&#x27;I&#x27;, &#x27;love&#x27;, &#x27;playing&#x27;, &#x27;soccer!&#x27;]
</span></code></pre>
<ul>
<li>Different from <em>word-forms</em> <img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/>
<ul>
<li><em>damélo</em>  →  <em>da</em>/<em>mé</em>/<em>lo</em> (=<em>give</em>/<em>me</em>/<em>it</em>)</li>
</ul>
</li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="6" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="tokenization-origins-2"><em>Tokenization Origins</em></h3>
<p>Natural language is split into...<br />
<br /></p>
<ul>
<li>
<p>Sentences, utterances, documents... (<em>macroscopical</em>)<br />
that are split into...<br /></p>
<ul>
<li>Tokens, word-forms... (<em>microscopical</em>)</li>
</ul>
</li>
</ul>
<p>→ Used for linguistic tasks (POS tagging, syntax parsing,...)</p>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-fragments="3" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="7" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="tokenization--ml">Tokenization &amp; ML</h3>
<p>ML-based NLP (usually) relies on <strong>sub-word</strong> tokenization:</p>
<ul>
<li data-marpit-fragment="1">Gives better performance</li>
<li data-marpit-fragment="2"><strong>Fixed-size vocabulary</strong> often required
<ul>
<li data-marpit-fragment="3">Out-Of-Vocabulary (OOV) issue</li>
</ul>
</li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="tokenization--ml-1">Tokenization &amp; ML</h3>
<p>Evolution of modeling complexity w.r.t. the sequence length n</p>
<center><table style="text-align: center;">
<tr><td><b>Model Type</b></td><td><b>Year</b></td><td><b>Complexity</b></td></tr>
<tr style="background: #Bfffbe;"><td>Tf-Idf</td><td>1972</td><td>O(1)</td></tr>
<tr style="background: #Ffe8be;"><td>RNNs</td><td>~1985</td><td>O(n)</td></tr>
<tr style="background: #Ffbebe;"><td>Transformers</td><td>2017</td><td>O(n<sup>2</sup>)</td></tr>
</table></center>
<p>→ Long sequences (e.g. character-level) are <mark>prohibitive</mark></p>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="7" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="modern-framework">Modern framework</h3>
<ul>
<li><strong>Pre-tokenization</strong> <code>&quot;I'm lovin' it!&quot; -&gt; [&quot;i&quot;, &quot;am&quot;, &quot;loving&quot;, &quot;it&quot;, &quot;!&quot;]</code>
<ul>
<li data-marpit-fragment="1">Normalization
<ul>
<li data-marpit-fragment="2">Rules around punctuation (<code>_:_</code>, <code>_!</code>, ...)</li>
<li data-marpit-fragment="3">Spelling correction (<code>&quot;imo&quot; -&gt; &quot;in my opinion&quot;</code>)</li>
<li data-marpit-fragment="4">Named entities (<code>&quot;covid&quot; -&gt; &quot;COVID-19&quot;</code>)</li>
<li data-marpit-fragment="5">...</li>
</ul>
</li>
<li data-marpit-fragment="6">Rule-based segmentation
<ul>
<li data-marpit-fragment="7">Blanks, punctuation, ...</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="modern-framework-1">Modern framework</h3>
<ul>
<li><strong>Tokenization</strong> <code>-&gt; [&quot;i&quot;, &quot;am&quot;, &quot;lov&quot;, &quot;##ing&quot;, &quot;it&quot;, &quot;!&quot;]</code>
<ul>
<li>Split units at subword level</li>
<li>Fixed vocabulary</li>
<li><strong>Trained</strong> on text samples</li>
<li>Used in inference mode at <em>pre-processing</em> time</li>
</ul>
</li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-class="lead" data-theme="gaia" lang="POSIX" class="lead" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--class:lead;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h1 id="sub-word-tokenization">Sub-word Tokenization</h1>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="granularity">Granularity</h3>
<center><img src='../imgs/course2/token_graph.png' /></center>
<footer>Course 2: Tokenization</footer>
</section>

<footer>Course 2: Tokenization</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="byte-pair-encoding-bpe">Byte-Pair Encoding (BPE)</h3>
<p>Let's encode &quot;<em>aaabdaaabac</em>&quot; in an optimized way:</p>
<ul>
<li data-marpit-fragment="1">Observed pairs: {<em>aa</em>, <em>ab</em>, <em>bd</em>, <em>da</em>, <em>ba</em>, <em>ac</em>}</li>
<li data-marpit-fragment="2">Observed <strong>occurences</strong>: {<mark><strong><em>aa</em>: 4</strong></mark>, <em>ab</em>: 2, <em>bd</em>: 1, <em>da</em>: 1, <em>ba</em>: 1, <em>ac</em>: 1}</li>
<li data-marpit-fragment="3">Set <em>X = aa</em></li>
<li data-marpit-fragment="4">Encode <em>aaabdaaabac</em> → <em>XabdXabac</em></li>
<li data-marpit-fragment="5">Start again from <em>XabdXabac</em></li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="byte-pair-encoding-bpe-1">Byte-Pair Encoding (BPE)</h3>
<p><small>(current rules: <em>aa → X</em>)</small><br />
Let's encode &quot;<em>XabdXabac</em>&quot; in an optimized way:</p>
<ul>
<li data-marpit-fragment="1">Observed pairs: {<em>Xa</em>, <em>ab</em>, <em>bd</em>, <em>dX</em>, <em>ba</em>, <em>ac</em>}</li>
<li data-marpit-fragment="2">Observed <strong>occurences</strong>: {<mark><strong><em>Xa</em>: 2</strong></mark>, <mark><strong><em>ab</em>: 2</strong></mark>, <em>bd</em>: 1, <em>dX</em>: 1, <em>ba</em>: 1, <em>ac</em>: 1}</li>
<li data-marpit-fragment="3">Set <em>Y = ab</em></li>
<li data-marpit-fragment="4">Encode <em>XabdXabac</em> → <em>XYdXYac</em></li>
<li data-marpit-fragment="5">Start again from <em>XYdXYac</em></li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="byte-pair-encoding-bpe-2">Byte-Pair Encoding (BPE)</h3>
<p><small>(current rules: <em>aa → X</em>, <em>ab → Y</em>)</small><br />
Let's encode &quot;<em>XYdXYac</em>&quot; in an optimized way:</p>
<ul>
<li data-marpit-fragment="1">Observed pairs: {<em>XY</em>, <em>Yd</em>, <em>dX</em>, <em>Ya</em>, <em>ac</em>}</li>
<li data-marpit-fragment="2">Observed occurences: {<mark><strong><em>XY</em>: 2</strong></mark>, <em>Yd</em>: 1, <em>dX</em>: 1, <em>Ya</em>: 1, <em>ac</em>: 1}</li>
<li data-marpit-fragment="3">Set <em>Z = XY</em></li>
<li data-marpit-fragment="4">Encode <em>XYdXYac</em> → <em>ZdZac</em></li>
<li data-marpit-fragment="5">Start again from <em>ZdZac</em></li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="3" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="byte-pair-encoding-bpe-3">Byte-Pair Encoding (BPE)</h3>
<p><small>(current rules: <em>aa → X</em>, <em>ab → Y</em>, <em>XY → Z</em>)</small><br />
Let's encode &quot;<em>ZdZac</em>&quot; in an optimized way:</p>
<ul>
<li data-marpit-fragment="1">Observed pairs: {<em>Zd</em>, <em>dZ</em>, <em>Za</em>, <em>ac</em>}</li>
<li data-marpit-fragment="2">Observed occurences: {<em>Zd</em>: 1, <em>dZ</em>: 1, <em>Za</em>: 1, <em>ac</em>: 1}</li>
<li data-marpit-fragment="3"><strong>All pairs are unique =&gt; END</strong></li>

<h3 id="byte-pair-encoding-bpe-4">Byte-Pair Encoding (BPE)</h3>
<p>Final encoding: <em>aaabdaaabac</em> → <em>ZdZac</em></p>
<p>with <strong>merge rules</strong>:</p>
<ol>
<li data-marpit-fragment="1"><em>aa → X</em></li>
<li data-marpit-fragment="2"><em>ab → Y</em></li>
<li data-marpit-fragment="3"><em>XY → Z</em></li>
</ol>
<p><ins>Decoding</ins>: follow merge rules in opposite order</p>
<footer>Course 2: Tokenization</footer>
</section>

<h3 id="the-unigram-philosophy">The Unigram Philosophy</h3>
<p><span class="success">Don't commit to one segmentation: model the uncertainty!</span></p>
<p><strong>Core Idea:</strong> Treat segmentation as a <span class="highlight">probability distribution</span></p>
<ul>
<li>Each token has a <strong>learned probability</strong></li>
<li>Each segmentation has probability = product of its token probabilities</li>
<li>Text probability = <span class="emphasis">sum over all possible segmentations</span></li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>

<h3 id="sampling-hello%E2%90%A3world-three-samples">Sampling &quot;hello␣world&quot;: Three Samples</h3>
<p><strong>Sample 1:</strong> <code>[&quot;hello&quot;, &quot;␣&quot;, &quot;world&quot;]</code></p>
<p><strong>Sample 2:</strong> <code>[&quot;he&quot;, &quot;ll&quot;, &quot;o&quot;, &quot;␣&quot;, &quot;w&quot;, &quot;or&quot;, &quot;ld&quot;]</code></p>
<p><strong>Sample 3:</strong> <code>[&quot;hello&quot;, &quot;␣&quot;, &quot;w&quot;, &quot;or&quot;, &quot;ld&quot;]</code></p>
<p><span class="highlight">We sample multiple times per document</span> to get diverse training signal.</p>
<p>Then we <span class="success">count</span> how often each token appeared across all samples.</p>
<footer>Course 2: Tokenization</footer>
</section>

<h1 id="limits--alternatives">Limits &amp; Alternatives</h1>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-fragments="4" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="50" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="limits">Limits</h3>
<ul>
<li data-marpit-fragment="1">Fixed vocabulary...
<ul>
<li data-marpit-fragment="2">... leads to OOV (out-of-vocabulary)</li>
<li data-marpit-fragment="3">... scales poorly to 100+ languages (and scripts)</li>
<li data-marpit-fragment="4">... can cause over-segmentation</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">bpe(<span class="hljs-string">&quot;artificial intelligence is real&quot;</span>) =&gt; <span class="hljs-string">&#x27;artificial&#x27;</span>, <span class="hljs-string">&#x27;intelligence&#x27;</span>, <span class="hljs-string">&#x27;is&#x27;</span>, <span class="hljs-string">&#x27;real&#x27;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">bpe(<span class="hljs-string">&quot;aritificial inteligense is reaal&quot;</span>) =&gt; 
<span class="hljs-string">&#x27;ari&#x27;</span>, <span class="hljs-string">&#x27;##ti&#x27;</span>, <span class="hljs-string">&#x27;##fi&#x27;</span>, <span class="hljs-string">&#x27;##cial&#x27;</span>, <span class="hljs-string">&#x27;intel&#x27;</span>, <span class="hljs-string">&#x27;##igen&#x27;</span>, <span class="hljs-string">&#x27;##se&#x27;</span>, <span class="hljs-string">&#x27;is&#x27;</span>, <span class="hljs-string">&#x27;re&#x27;</span>, <span class="hljs-string">&#x27;##aa&#x27;</span>, <span class="hljs-string">&#x27;##l&#x27;</span>
</code></pre>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="51" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="alternatives---bpe-dropout-small-provilkov-et-al-small">Alternatives - BPE dropout <small> (Provilkov et al.) </small></h3>
<p>→ Randomly removes part of the vocabulary during training<br />
<br /></p>
<center><img width=1000px src='../imgs/course2/bpe_dropout.png' /></center>
=&gt; makes models more robust to misspellings
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="52" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="alternatives---characterbert-small-el-boukkouri-et-al-small">Alternatives - CharacterBERT <small> (El Boukkouri et al.) </small></h3>
<center><img width=500px src='../imgs/course2/character_bert.png' /></center>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="53" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="alternatives---byt5-small-xue-et-al-small">Alternatives - ByT5 <small> (Xue et al.) </small></h3>
<ul>
<li>Gives directly bytes (~characters) as inputs to the model</li>
</ul>
<center><img width=900px src='../imgs/course2/byt5.png' /></center>
<p>=&gt; more robust and data efficient BUT ~10 times slower and more hardware consumption</p>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="54" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="neural-tokenization---manta-small-godey-et-al-small">Neural tokenization - MANTa <small> (Godey et al.) </small></h3>
<ul>
<li>Allows the language model to learn its <em>own</em> mapping</li>
</ul>
<center><img width=800px src='../imgs/course2/manta.gif' /></center>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="55" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="neural-tokenization---megabyte-small-yu-et-al-small">Neural tokenization - MEGABYTE <small> (Yu et al.) </small></h3>
<ul>
<li>Encode and then decode autoregressively</li>
</ul>
<center><img width=500px src='../imgs/course2/megabyte.png' /></center>
<footer>Course 2: Tokenization</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-marpit-fragments="7" data-paginate="true" data-background-color="#fff" data-footer="Course 2: Tokenization" data-theme="gaia" lang="POSIX" data-marpit-pagination="56" style="--paginate:true;--background-color:#fff;--footer:Course 2: Tokenization;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="56">
<h3 id="takeaways">Takeaways</h3>
<ul>
<li data-marpit-fragment="1">Tokenization: Art of splitting sentences/words into meaningful smaller units</li>
<li data-marpit-fragment="2">In ML: subword tokenization is <small>(very)</small> commonly used</li>
<li data-marpit-fragment="3">Three main algorithms
<ul>
<li data-marpit-fragment="4"><strong>BPE</strong>: iteratively learn most frequent merges</li>
<li data-marpit-fragment="5"><strong>WordPiece</strong>: BPE with adjusted frequency score</li>
<li data-marpit-fragment="6"><strong>Unigram</strong>: Start big and remove tokens that won't be missed</li>
</ul>
</li>
<li data-marpit-fragment="7">When facing noisy and/or complex text, alternatives exist</li>
</ul>
<footer>Course 2: Tokenization</footer>
</section>
