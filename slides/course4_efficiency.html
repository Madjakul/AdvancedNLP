<h3 id="mixed-precision">Mixed precision</h3>
<ul>
<li data-marpit-fragment="1">
<p>Batch size matters:</p>
<ul>
<li data-marpit-fragment="2">No bigger than 1-2M tokens (Kaplan et al., 2020)</li>
<li data-marpit-fragment="3">Maximize parallel computation</li>
</ul>
</li>
<li data-marpit-fragment="4">
<p>Float precision:</p>
<ul>
<li data-marpit-fragment="5"><code>float16</code>: reduces memory usage, good with V100-gen GPUs</li>
<li data-marpit-fragment="6"><code>bfloat16</code>: more stability, but only usable with A100-gen GPUs</li>
</ul>
</li>
</ul>
<footer>Course 4: Efficient NLP</footer>
</section>

<h3 id="multi-gpu-training-1">Multi GPU training</h3>
<ul>
<li>Optimization OOM scenario
<ul>
<li data-marpit-fragment="1">Model fits on the GPU</li>
<li data-marpit-fragment="2">Forward + backward fit with the <code>batch_size</code></li>
<li data-marpit-fragment="3"><ins> Optimization saturates GPU </ins></li>
</ul>
</li>
</ul>
<ul>
<li data-marpit-fragment="4">Use memory-efficient optimizers
<ul>
<li data-marpit-fragment="5"><a href="https://arxiv.org/abs/1804.04235">Adafactor</a>: factor momentum matrix in Adam</li>
<li data-marpit-fragment="6"><a href="https://arxiv.org/abs/2307.02047">CAME</a>: regularize Adafactor</li>
<li data-marpit-fragment="7"><a href="https://arxiv.org/abs/2302.06675">LION</a>: only tracks momentum</li>
</ul>
</li>
</ul>
<footer>Course 4: Efficient NLP</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-fragments="4" data-paginate="true" data-background-color="#fff" data-footer="Course 4: Efficient NLP" data-theme="gaia" lang="POSIX" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--footer:Course 4: Efficient NLP;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="74">
<h3 id="multi-gpu-training-2">Multi GPU training</h3>
<ul>
<li>Forward/backward OOM scenario
<ul>
<li>Model fits on the GPU</li>
<li><ins>Forward + backward saturates with the <code>batch_size</code></ins></li>
</ul>
</li>
</ul>
<ul>
<li data-marpit-fragment="1">Use gradient accumulation
<ul>
<li data-marpit-fragment="2">Compute forwards with <code>micro_batch_size</code> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.152ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.437ex" role="img" focusable="false" viewBox="0 -568 1000 635"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="226A" d="M639 -48Q639 -54 634 -60T619 -67H618Q612 -67 536 -26Q430 33 329 88Q61 235 59 239Q56 243 56 250T59 261Q62 266 336 415T615 567L619 568Q622 567 625 567Q639 562 639 548Q639 540 633 534Q632 532 374 391L117 250L374 109Q632 -32 633 -34Q639 -40 639 -48ZM944 -48Q944 -54 939 -60T924 -67H923Q917 -67 841 -26Q735 33 634 88Q366 235 364 239Q361 243 361 250T364 261Q367 266 641 415T920 567L924 568Q927 567 930 567Q944 562 944 548Q944 540 938 534Q937 532 679 391L422 250L679 109Q937 -32 938 -34Q944 -40 944 -48Z"></path></g></g></g></svg></mjx-container> <code>batch_size</code></li>
<li data-marpit-fragment="3">Sum <code>micro_batch_size//batch_size</code> gradients</li>
<li data-marpit-fragment="4">Backward once</li>
</ul>
</li>
</ul>
<footer>Course 4: Efficient NLP</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="6" data-paginate="true" data-background-color="#fff" data-footer="Course 4: Efficient NLP" data-theme="gaia" lang="POSIX" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--footer:Course 4: Efficient NLP;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="74">
<h3 id="multi-gpu-training-3">Multi GPU training</h3>
<ul>
<li data-marpit-fragment="1"><strong>Distirbuted Data Parallel (DDP)</strong> with <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.179ex" height="1.595ex" role="img" focusable="false" viewBox="0 -694 521 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D458" d="M121 647Q121 657 125 670T137 683Q138 683 209 688T282 694Q294 694 294 686Q294 679 244 477Q194 279 194 272Q213 282 223 291Q247 309 292 354T362 415Q402 442 438 442Q468 442 485 423T503 369Q503 344 496 327T477 302T456 291T438 288Q418 288 406 299T394 328Q394 353 410 369T442 390L458 393Q446 405 434 405H430Q398 402 367 380T294 316T228 255Q230 254 243 252T267 246T293 238T320 224T342 206T359 180T365 147Q365 130 360 106T354 66Q354 26 381 26Q429 26 459 145Q461 153 479 153H483Q499 153 499 144Q499 139 496 130Q455 -11 378 -11Q333 -11 305 15T277 90Q277 108 280 121T283 145Q283 167 269 183T234 206T200 217T182 220H180Q168 178 159 139T145 81T136 44T129 20T122 7T111 -2Q98 -11 83 -11Q66 -11 57 -1T48 16Q48 26 85 176T158 471L195 616Q196 629 188 632T149 637H144Q134 637 131 637T124 640T121 647Z"></path></g></g></g></svg></mjx-container> GPUs
<ul>
<li data-marpit-fragment="2">Copy the model on the <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.179ex" height="1.595ex" role="img" focusable="false" viewBox="0 -694 521 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D458" d="M121 647Q121 657 125 670T137 683Q138 683 209 688T282 694Q294 694 294 686Q294 679 244 477Q194 279 194 272Q213 282 223 291Q247 309 292 354T362 415Q402 442 438 442Q468 442 485 423T503 369Q503 344 496 327T477 302T456 291T438 288Q418 288 406 299T394 328Q394 353 410 369T442 390L458 393Q446 405 434 405H430Q398 402 367 380T294 316T228 255Q230 254 243 252T267 246T293 238T320 224T342 206T359 180T365 147Q365 130 360 106T354 66Q354 26 381 26Q429 26 459 145Q461 153 479 153H483Q499 153 499 144Q499 139 496 130Q455 -11 378 -11Q333 -11 305 15T277 90Q277 108 280 121T283 145Q283 167 269 183T234 206T200 217T182 220H180Q168 178 159 139T145 81T136 44T129 20T122 7T111 -2Q98 -11 83 -11Q66 -11 57 -1T48 16Q48 26 85 176T158 471L195 616Q196 629 188 632T149 637H144Q134 637 131 637T124 640T121 647Z"></path></g></g></g></svg></mjx-container> GPUs</li>
<li data-marpit-fragment="3">Send a micro-batch to each GPU</li>
<li data-marpit-fragment="4">Compute forward/backward in parallel on each GPU</li>
<li data-marpit-fragment="5"><em>Send</em> gradients to one GPU &amp; optimize</li>

</li>
</ul>

</section>

<h3 id="adapters">Adapters</h3>

<p><em>Parameter-Efficient Transfer Learning for NLP</em> (Houlsby et al. 2019)</p>
<p><strong>The Problem</strong>: Fine-tuning all parameters of a pre-trained model is expensive and requires storing a complete copy for each task.</p>
<p><strong>The Solution</strong>: Insert small, trainable modules (adapters) into the frozen pre-trained model.</p>

<h3 id="adapters-4">Adapters</h3>
<p><strong>Intuition</strong>: Pre-trained representations capture general language understanding. The adapter layers learn task-specific transformations.</p>
<p><strong>The bottleneck</strong> forces the model to learn a compressed, task-relevant representation. This acts as a form of regularization and prevents overfitting on small datasets.</p>
<p><strong>Residual connections</strong> ensure that if no adaptation is needed, the adapter can learn to output near-zero values.</p>
<footer>Course 4: Efficient NLP</footer>
</section>

<h3 id="lora">LoRA</h3>
<p><em>Low-Rank Adaptation of Large Language Models</em> (Hu et al. 2021)</p>
<p>Adapters add sequential operations (down-project -&gt; activate -&gt; up-project), which increases inference latency.</p>
<p><strong>Key observation</strong>: Weight updates during fine-tuning often have low intrinsic rank. We can represent these updates as low-rank decompositions.</p>

<h3 id="lora-4">LoRA</h3>

<h5 id="which-layers-to-adapt">Which Layers to Adapt?</h5>
<p><strong>Attention matrices</strong> (Q, K, V, O projections): Most commonly adapted. Different attention heads may need different adjustments for new tasks.</p>
<p><strong>Feed-forward layers</strong>: Can also be adapted, though often less critical.</p>
<p><strong>Embedding layers</strong>: Rarely adapted with LoRA.</p>
<p>Empirically, adapting just the attention query and value projections often suffices for good performance.</p>
<footer>Course 4: Efficient NLP</footer>
</section>

<h3 id="quantization">Quantization</h3>
<p>Modern LLMs use <code>float16</code> or <code>bfloat16</code> representations:</p>
<ul>
<li>2 bytes per parameter</li>
<li>A 7B parameter model requires ~14GB just for weights</li>
<li>Add activations, optimizer states -&gt; 40GB+ during inference</li>
</ul>
<p><strong>Goal</strong>: Reduce precision to <code>int8</code> (1 byte) or <code>int4</code> (0.5 bytes) while maintaining accuracy.</p>
<footer>Course 4: Efficient NLP</footer>
</section>

<h3 id="kv-cache">KV-cache</h3>
<p>When generating text, transformers compute attention over all previous tokens at each step:</p>
<p><strong>Step 1</strong>: Generate token 1 from prompt<br />
<strong>Step 2</strong>: Generate token 2 attending to prompt + token 1<br />
<strong>Step 3</strong>: Generate token 3 attending to prompt + token 1 + token 2<br />
...</p>
<p>Each step recomputes attention for all previous tokens. This is wasteful.</p>
<footer>Course 4: Efficient NLP</footer>
</section>

<h3 id="speculative-decoding">Speculative decoding</h3>
<p>An <strong>LLM</strong> can <strong>predict multiple tokens in a single forward pass</strong> :</p>
<ul>
<li><strong>Speculative decoding</strong> [5] allows an LLM to <strong>&quot;guess&quot; future tokens</strong> while generating current tokens, <strong>all within a single forward pass</strong>.</li>
<li>By running a draft model to predict multiple tokens, the main model (larger) only has to verify the predicted tokens for &quot;correctness&quot;.</li>
</ul>
<footer>Course 4: Efficient NLP</footer>
</section>

<h2 id="model-reduction">Model Reduction</h2>
<footer>Course 4: Efficient NLP</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-background-color="#fff" data-footer="Course 4: Efficient NLP" data-theme="gaia" lang="POSIX" data-marpit-pagination="63" style="--paginate:true;--background-color:#fff;--footer:Course 4: Efficient NLP;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="74">
<h3 id="distillation">Distillation</h3>
<p><strong>Goal</strong>: Transfer knowledge from a large, accurate &quot;teacher&quot; model to a smaller, faster &quot;student&quot; model.</p>
<p><strong>Why?</strong> Pre-training from scratch is expensive. Distillation allows creating smaller models that retain much of the teacher's performance at a fraction of the cost.</p>
<p>First proposed by Hinton et al. (2015), refined for NLP by Sanh et al. (2019) with DistilBERT.</p>
<footer>Course 4: Efficient NLP</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-marpit-scope-zUcqMsKo="" data-paginate="true" data-background-color="#fff" data-footer="Course 4: Efficient NLP" data-theme="gaia" lang="POSIX" data-marpit-pagination="64" style="--paginate:true;--background-color:#fff;--footer:Course 4: Efficient NLP;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="74">
<h3 id="distillation-1">Distillation</h3>

<p>Standard training uses &quot;hard&quot; labels: correct token = 1.0, all others = 0.0</p>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> We <strong>lose information</strong> about the <strong>model's uncertainty</strong> and token similarities.</p>
<p><strong>Example</strong>: For &quot;I'm going to the ___&quot;</p>
<ul>
<li>Teacher might give: zoo (0.7), park (0.15), doctor (0.1), ...</li>
<li>Hard label gives: zoo (1.0), all others (0.0)</li>
</ul>
<p>The teacher's distribution encodes valuable information about plausible alternatives.</p>
<footer>Course 4: Efficient NLP</footer>
</section>

" height="60" x="120" y="220"></rect></g></g></g></svg></mjx-container>, so we multiply by <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.029ex;" xmlns="http://www.w3.org/2000/svg" width="2.28ex" height="1.916ex" role="img" focusable="false" viewBox="0 -833.9 1007.6 846.9"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D70F" d="M39 284Q18 284 18 294Q18 301 45 338T99 398Q134 425 164 429Q170 431 332 431Q492 431 497 429Q517 424 517 402Q517 388 508 376T485 360Q479 358 389 358T299 356Q298 355 283 274T251 109T233 20Q228 5 215 -4T186 -13Q153 -13 153 20V30L203 192Q214 228 227 272T248 336L254 357Q254 358 208 358Q206 358 197 358T183 359Q105 359 61 295Q56 287 53 286T39 284Z"></path></g><g data-mml-node="mn" transform="translate(604,363) scale(0.707)"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></g></svg></mjx-container> to maintain gradient scale comparable to the CE term.</p>
<p>In practice, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.029ex;" xmlns="http://www.w3.org/2000/svg" width="1.17ex" height="1.005ex" role="img" focusable="false" viewBox="0 -431 517 444"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D70F" d="M39 284Q18 284 18 294Q18 301 45 338T99 398Q134 425 164 429Q170 431 332 431Q492 431 497 429Q517 424 517 402Q517 388 508 376T485 360Q479 358 389 358T299 356Q298 355 283 274T251 109T233 20Q228 5 215 -4T186 -13Q153 -13 153 20V30L203 192Q214 228 227 272T248 336L254 357Q254 358 208 358Q206 358 197 358T183 359Q105 359 61 295Q56 287 53 286T39 284Z"></path></g></g></g></svg></mjx-container> is typically 2-4, and <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.448ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 640 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D6FC" d="M34 156Q34 270 120 356T309 442Q379 442 421 402T478 304Q484 275 485 237V208Q534 282 560 374Q564 388 566 390T582 393Q603 393 603 385Q603 376 594 346T558 261T497 161L486 147L487 123Q489 67 495 47T514 26Q528 28 540 37T557 60Q559 67 562 68T577 70Q597 70 597 62Q597 56 591 43Q579 19 556 5T512 -10H505Q438 -10 414 62L411 69L400 61Q390 53 370 41T325 18T267 -2T203 -11Q124 -11 79 39T34 156ZM208 26Q257 26 306 47T379 90L403 112Q401 255 396 290Q382 405 304 405Q235 405 183 332Q156 292 139 224T121 120Q121 71 146 49T208 26Z"></path></g></g></g></svg></mjx-container> is around 0.5-0.9 (favoring distillation).</p>

<h3 id="mixture-of-experts-1">Mixture of experts</h3>
<ul>
<li>Reduced computation during training and inference since we only need to run <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.271ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1888 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(500,0)"><g data-mml-node="mo"><path data-c="2F" d="M423 750Q432 750 438 744T444 730Q444 725 271 248T92 -240Q85 -250 75 -250Q68 -250 62 -245T56 -231Q56 -221 230 257T407 740Q411 750 423 750Z"></path></g></g><g data-mml-node="mi" transform="translate(1000,0)"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g></g></g></svg></mjx-container>th of the FFN weights.</li>
<li>Unstable during training: can struggle to generalize, thus prone to overfitting.</li>
<li>Load balancing is crucial: we do not want a subset of experts to be under-utilized.</li>
</ul>

<h3 id="mixture-of-experts-2">Mixture of experts</h3>
<p>A learned gating network <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.778ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 786 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43A" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q492 659 471 656T418 643T357 615T294 567T236 496T189 394T158 260Q156 242 156 221Q156 173 170 136T206 79T256 45T308 28T353 24Q407 24 452 47T514 106Q517 114 529 161T541 214Q541 222 528 224T468 227H431Q425 233 425 235T427 254Q431 267 437 273H454Q494 271 594 271Q634 271 659 271T695 272T707 272Q721 272 721 263Q721 261 719 249Q714 230 709 228Q706 227 694 227Q674 227 653 224Q646 221 643 215T629 164Q620 131 614 108Q589 6 586 3Q584 1 581 1Q571 1 553 21T530 52Q530 53 528 52T522 47Q448 -22 322 -22Q201 -22 126 55T50 252Z"></path></g></g></g></svg></mjx-container> decides which experts <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.729ex" height="1.538ex" role="img" focusable="false" viewBox="0 -680 764 680"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D438" d="M492 213Q472 213 472 226Q472 230 477 250T482 285Q482 316 461 323T364 330H312Q311 328 277 192T243 52Q243 48 254 48T334 46Q428 46 458 48T518 61Q567 77 599 117T670 248Q680 270 683 272Q690 274 698 274Q718 274 718 261Q613 7 608 2Q605 0 322 0H133Q31 0 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q146 66 215 342T285 622Q285 629 281 629Q273 632 228 634H197Q191 640 191 642T193 65
