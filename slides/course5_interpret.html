<h1 id="modern-nlp-interpretability"><strong>Modern NLP Interpretability</strong></h1>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-background-color="#fff" data-footer="Course 5: Modern NLP Interpretability" data-theme="gaia" lang="POSIX" data-marpit-pagination="2" style="--paginate:true;--background-color:#fff;--footer:Course 5: Modern NLP Interpretability;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="57">
<h3 id="introduction">Introduction</h3>
<p><strong>Neural networks are no longer simple classifiers</strong>. Modern <strong>large language models have hundreds of billions of parameters</strong> and exhibit <strong>emergent capabilities</strong>.</p>
<p>Interpretability is the science of <strong>reverse-engineering these systems to understand what they learn and how they compute</strong>. It's essential for safety, debugging, and building trust in deployed systems.</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#fff" data-footer="Course 5: Modern NLP Interpretability" data-theme="gaia" lang="POSIX" data-marpit-pagination="3" style="--paginate:true;--background-color:#fff;--footer:Course 5: Modern NLP Interpretability;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="57">
<h3 id="introduction-1">Introduction</h3>
<p><strong>Before transformers</strong>, interpretability <strong>focused on simpler questions</strong>. We could <strong>examine learned word embeddings, visualize attention in sequence-to-sequence models, and probe hidden representations</strong> for linguistic properties.</p>
<p>These methods <strong>assumed models were relatively shallow</strong> and that their <strong>internal representations were human-interpretable by design</strong>. This assumption <strong>breaks down completely for modern transformers</strong>.</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#fff" data-footer="Course 5: Modern NLP Interpretability" data-theme="gaia" lang="POSIX" data-marpit-pagination="4" style="--paginate:true;--background-color:#fff;--footer:Course 5: Modern NLP Interpretability;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="57">
<h3 id="introduction-2">Introduction</h3>
<h4 id="classical-method-1-embedding-spaces">Classical Method 1: Embedding Spaces</h4>
<p>Word2vec and GloVe embeddings could be visualized in 2D using dimensionality reduction. We found that semantic relationships formed geometric patterns.</p>

<h4 id="classical-method-2-attention-visualization-2">Classical Method 2: Attention Visualization</h4>

<p>They also showed <strong>you can adversarially perturb attention weights without changing outputs</strong>. If we <strong>replace the learned attention distribution with a different distribution, the model often produces the same answer</strong> because the value vectors <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.74ex" height="1.595ex" role="img" focusable="false" viewBox="0 -683 769 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D449" d="M52 648Q52 670 65 683H76Q118 680 181 680Q299 680 320 683H330Q336 677 336 674T334 656Q329 641 325 637H304Q282 635 274 635Q245 630 242 620Q242 618 271 369T301 118L374 235Q447 352 520 471T595 594Q599 601 599 609Q599 633 555 637Q537 637 537 648Q537 649 539 661Q542 675 545 679T558 683Q560 683 570 683T604 682T668 681Q737 681 755 683H762Q769 676 769 672Q769 655 760 640Q757 637 743 637Q730 636 719 635T698 630T682 623T670 615T660 608T652 599T645 592L452 282Q272 -9 266 -16Q263 -18 259 -21L241 -22H234Q216 -22 216 -15Q213 -9 177 305Q139 623 138 626Q133 637 76 637H59Q52 642 52 648Z"></path></g></g></g></svg></mjx-container> compensate.</p>

<h3 id="introduction-7">Introduction</h3>
<h4 id="why-classical-methods-fail">Why Classical Methods Fail?</h4>
<p>Modern transformers are <strong>deep, non-linear, and highly distributed</strong>. The representations they learn are <strong><em>polysemantic</em> (single neurons activate for multiple unrelated concepts)</strong>, <strong><em>superposed</em> (features are encoded in overlapping subspaces)</strong>, and <strong><em>contextual</em> (the same activation pattern means different things in different contexts)</strong>.</p>
<p>We need methods that establish causation rather than correlation, and that account for the compositional nature of these models.</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<footer>Course 5: Modern NLP Interpretability</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#fff" data-footer="Course 5: Modern NLP Interpretability" data-theme="gaia" lang="POSIX" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--footer:Course 5: Modern NLP Interpretability;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="57">
<h3 id="probing-and-intervention-methods-1">Probing and Intervention Methods</h3>
<p>Before we understand circuits, we need methods that reveal what information exists in representations and how it flows through the network.</p>
<p>Think of <strong>probing</strong> as asking <strong>&quot;what does the model know?&quot;</strong> and <strong>intervention</strong> as asking <strong>&quot;what does the model use?&quot;</strong></p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="linear-probing-2">Linear probing</h3>

<p>Probing reveals <strong>what information is present in representations</strong>. Classical results showed BERT representations contain syntactic information (parse trees) in middle layers, semantic information (word senses) in upper layers, and positional information in early layers.</p>
<p>But <strong>presence doesn't imply the model uses this information for prediction</strong>.</p>
<p>Probing shows correlation. <strong>To establish causation, we intervene on representations and measure downstream effects</strong>.</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="activation-patching-1">Activation Patching</h3>

<h4 id="patching-example-indirect-object-identification">Patching Example: Indirect Object Identification</h4>
<p>Consider the task: &quot;The dog gave the cat the bone&quot; → identify &quot;cat&quot; as the indirect object.</p>
<p><strong>Clean input</strong>: &quot;The dog gave the cat the bone&quot;<br />
<strong>Corrupt input</strong>: &quot;The dog gave the mouse the bone&quot;</p>
<p>We <strong>patch activations</strong> and <strong>measure when the model's prediction switches from &quot;mouse&quot; back to &quot;cat&quot;</strong>. The layer where patching has maximal effect is where the indirect object information is processed and used.</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="steering-vectors-2">Steering vectors</h3>

<p>Let's extract a &quot;sycophancy vector&quot; to make models more or less agreeable.</p>
<p>Positive examples:</p>
<ul>
<li>&quot;I think the earth is flat.&quot; → &quot;You're absolutely right, the earth is flat.&quot;</li>
<li>&quot;I believe vaccines cause autism.&quot; → &quot;That's a valid perspective.&quot;</li>
</ul>
<p>Negative examples:</p>
<ul>
<li>&quot;I think the earth is flat.&quot; → &quot;That's incorrect. The earth is approximately spherical.&quot;</li>
<li>&quot;I believe vaccines cause autism.&quot; → &quot;Scientific evidence strongly contradicts that.&quot;</li>
</ul>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="probing-and-intervention-methods-2">Probing and intervention methods</h3>
<p>These methods reveal what and where, but not how. We know syntactic information exists in layer 8, and we know patching layer 8 affects pronoun resolution, but we don't know the algorithm the model uses to compute pronoun resolution.</p>
<p>To understand how, we need mechanistic interpretability—we need to reverse-engineer the actual circuits the model implements.</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="transformer-circuits-1">Transformer circuits</h3>
<p>A transformer is a composition of many small circuits, each performing a specific computation. Circuits interpretability means <strong>reverse-engineering these subcircuits</strong> to <strong>understand the algorithms the model has learned</strong>.</p>

</section>

<h3 id="induction-heads">Induction heads</h3>
<p>Induction heads complete repeated sequences. Given &quot;[A][B]...[A]&quot;, they predict &quot;[B]&quot;.</p>
<p>This requires composing two components:</p>
<ol>
<li>A &quot;previous token head&quot; that creates copies of representations at position <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="4.677ex" height="1.692ex" role="img" focusable="false" viewBox="0 -666 2067.4 748"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(567.2,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z"></path></g><g data-mml-node="mn" transform="translate(1567.4,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container></li>
<li>An &quot;induction head&quot; that searches for those copied representations</li>
</ol>
<p>These compose into a two-layer circuit.</p>

<h3 id="finding-circuits">Finding Circuits</h3>
<p>To identify a circuit for a specific behavior, we need to solve an attribution problem. Given a behavior (e.g., completing &quot;[A][B]...[A]&quot; with &quot;[B]&quot;), which components are necessary and sufficient?</p>
<p>We use activation patching to measure:</p>
<ul>
<li><strong>Necessity:</strong> does ablating this component break the behavior?</li>
<li><strong>Sufficiency:</strong> does patching only this component restore the behavior?</li>
</ul>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="finding-circuits-1">Finding Circuits</h3>
<ol>
<li>Run clean and corrupt inputs through the model</li>
<li>For each component <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.98ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 433 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g></g></g></svg></mjx-container> (attention head or neuron):
<ul>
<li>Measure necessity: patch <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.98ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 433 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D450" d="M34 159Q34 268 120 355T306 442Q362 442 394 418T427 355Q427 326 408 306T360 285Q341 285 330 295T319 325T330 359T352 380T366 386H367Q367 388 361 392T340 400T306 404Q276 404 249 390Q228 381 206 359Q162 315 142 235T121 119Q121 73 147 50Q169 26 205 26H209Q321 26 394 111Q403 121 406 121Q410 121 419 112T429 98T420 83T391 55T346 25T282 0T202 -11Q127 -11 81 37T34 159Z"></path></g></g></g></svg></mjx-container> from corrupt -&gt; clean, measure restoration</li>

<h3 id="the-superposition-obstacle">The Superposition Obstacle</h3>

<p>Circuits interpretability assumes we can identify what each neuron or head does. But <strong>individual neurons are often polysemantic: they activate for multiple unrelated concepts.</strong></p>

<h3 id="sparse-autoencoders-saes-4">Sparse Autoencoders (SAEs)</h3>

<h4 id="finding-max-activating-examples">Finding Max Activating Examples</h4>
<p>How do we know what &quot;Feature 1234&quot; represents? We find the text that makes it fire the most. <img class="emoji" draggable="false" alt="🕵️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f575.svg" data-marp-twemoji=""/></p>
<ol>
<li><strong>Scan Dataset:</strong> Run a massive text dataset through the model and the SAE.</li>
<li><strong>Record Activations:</strong> For Feature 1234, save every text snippet that caused it to activate.</li>
<li><strong>Sort by Strength:</strong> Sort this list to find the examples that caused the <em>strongest</em> activation.</li>
<li><strong>Find the Pattern:</strong> A human reads the top ~20 examples to find the shared, underlying concept.</li>
</ol>

<h3 id="sparse-autoencoders-saes-7">Sparse autoencoders (SAEs)</h3>
<p>Recent work questions <strong>whether SAEs recover the features the model actually uses or whether they create artificial features</strong> that happen to be interpretable but aren't the model's &quot;true&quot; features.</p>
<p>The debate centers on uniqueness: <strong>are the features recovered by SAEs the only way to decompose the superposition</strong>, or are there many possible decompositions?</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="sparse-autoencoders-saes-8">Sparse autoencoders (SAEs)</h3>
<h4 id="causal-scrubbing-validating-circuit-explanations">Causal scrubbing: validating circuit explanations</h4>

<p>Causal scrubbing <strong>tests whether a circuit explanation is complete</strong>. Given a <strong>hypothesized circuit <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.719ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 760 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></svg></mjx-container>, we &quot;scrub&quot; (randomize) all activations not in <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.719ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 760 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></svg></mjx-container></strong>. If the behavior persists, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.719ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 760 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></svg></mjx-container> is sufficient. If the behavior disappears, <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.719ex" height="1.645ex" role="img" focusable="false" viewBox="0 -705 760 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D436" d="M50 252Q50 367 117 473T286 641T490 704Q580 704 633 653Q642 643 648 636T656 626L657 623Q660 623 684 649Q691 655 699 663T715 679T725 690L740 705H746Q760 705 760 698Q760 694 728 561Q692 422 692 421Q690 416 687 415T669 413H653Q647 419 647 422Q647 423 648 429T650 449T651 481Q651 552 619 605T510 659Q484 659 454 652T382 628T299 572T226 479Q194 422 175 346T156 222Q156 108 232 58Q280 24 350 24Q441 24 512 92T606 240Q610 253 612 255T628 257Q648 257 648 248Q648 243 647 239Q618 132 523 55T319 -22Q206 -22 128 53T50 252Z"></path></g></g></g></svg></mjx-container> was incomplete.</p>
<p>For the induction head circuit, we hypothesize that only layer 1 previous token head and layer 2 induction head matter. We scrub all other activations by:</p>
<ol>
<li>Running multiple forward passes with different random inputs</li>
<li>Keeping layer 1 previous token head and layer 2 induction head from the original input</li>
<li>Using randomized activations for everything else</li>
</ol>
<p>If the model still completes &quot;[A][B]...[A]&quot; with &quot;[B]&quot;, the circuit is validated.</p>

<h3 id="the-evaluation-problem-1">The Evaluation Problem</h3>
<p>Current methods work well on small models (GPT-2 scale, 1.5B parameters) and specific tasks. Open challenges for scaling to production models (100B+ parameters):</p>
<ul>
<li><strong>Computational cost</strong>: Activation patching requires many forward passes</li>
<li><strong>Feature identification</strong>: More parameters means more features in superposition</li>
<li><strong>Circuit complexity</strong>: Larger models may use more complex circuits</li>
</ul>

<h3 id="the-evaluation-problem-2">The Evaluation Problem</h3>
<p>Unlike supervised learning where we have ground truth labels, <strong>we don't have ground truth for &quot;what the model is really computing&quot;</strong>.</p>
<ul>
<li><strong>Faithfulness</strong>: Does the explanation predict model behavior?</li>
<li><strong>Completeness</strong>: Does it explain all relevant behavior?</li>
<li><strong>Minimality</strong>: Is it the simplest explanation?</li>
<li><strong>Generalization</strong>: Does it transfer to new inputs?</li>
</ul>

<p>For <strong>circuit explanations</strong>, we use <strong>causal scrubbing</strong>: the behavior should persist when we randomize everything outside the circuit.</p>
<p>For <strong>feature explanations</strong>, we <strong>test if ablating the feature changes behavior in the predicted direction</strong>.</p>

<h3 id="the-evaluation-problem-4">The Evaluation Problem</h3>

<h4 id="faithfulness-metrics-1">Faithfulness Metrics</h4>
<p>Once you have an interpretation, actively try to break it by finding counterexamples. This is analogous to adversarial robustness testing.</p>
<p>For an induction head explanation:</p>
<ul>
<li>Test: &quot;A B C A&quot; → Does it predict B or C? (Should predict B)</li>
<li>Test: &quot;A B A B&quot; → Does it predict B? (Should predict B)</li>
<li>Test: &quot;A B C D A&quot; → Does it skip C and D? (Should predict B)</li>
</ul>
<p>If the explanation survives adversarial testing, we gain confidence in its validity.</p>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>

<h3 id="key-takeaways">Key Takeaways</h3>
<ol>
<li>Classical methods (attention, gradients) measure correlation, not causation</li>
<li>Intervention methods (patching, steering) establish causal relationships</li>
<li>Transformers implement circuits</li>
<li>Superposition makes neuron-level analysis unreliable</li>
<li>SAE learning disentangle superposed features (<em>allegedly</em>)</li>
</ol>
<footer>Course 5: Modern NLP Interpretability</footer>
</section>
